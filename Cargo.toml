[package]
name = "proof-broadcast-tree"
version = "0.1.0"
edition = "2024"
description = "Shadow-compatible leanVM proof-aggregation-tree simulator"

[lib]
name = "proof_broadcast_tree"
path = "src/lib.rs"

[[bin]]
name = "proof-broadcast-tree"
path = "src/main.rs"

# libp2p comes from the same kamilsa/rust-libp2p fork proof-broadcast uses.
# No gossipsub: peers talk over one request-response protocol.
[dependencies]
libp2p = { git = "https://github.com/kamilsa/rust-libp2p", rev = "2473afce1b3e05393f86aabdcdf57aa4ab1d6c2e", features = [
    "request-response",
    "quic",
    "dns",
    "tokio",
    "macros",
] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
rand = "0.10"
futures = "0.3"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# Shadow-compatible UDP (see ec-sim).
[patch.crates-io]
quinn-udp = { path = "patch/quinn-udp" }
